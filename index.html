<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AnchorSense HomePro — Smart Tank Monitoring</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #ffffff;
      color: #1a1a1a;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 24px;
    }
    .container {
      max-width: 560px;
      width: 100%;
      text-align: center;
    }
    .logo {
      width: 56px;
      height: 56px;
      background: #1D9E75;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
    }
    .logo svg {
      width: 28px;
      height: 28px;
      stroke: #ffffff;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .eyebrow {
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #767676;
      margin-bottom: 8px;
    }
    h1 {
      font-size: 2rem;
      font-weight: 500;
      margin-bottom: 16px;
      line-height: 1.2;
    }
    .tagline {
      font-size: 1.1rem;
      color: #555;
      line-height: 1.6;
      margin-bottom: 48px;
    }
    .footer {
      border-top: 1px solid #e8e8e8;
      padding-top: 32px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 24px;
      flex-wrap: wrap;
    }
    .footer a, .footer span {
      font-size: 13px;
      color: #767676;
      text-decoration: none;
    }
    .footer a:hover { color: #1a1a1a; }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 12m-1 0a1 1 0 1 0 2 0a1 1 0 1 0 -2 0"/>
        <path d="M9.172 9.172a4 4 0 1 0 5.656 5.656"/>
        <path d="M6.343 6.343a8 8 0 1 0 11.314 11.314"/>
        <path d="M3.515 3.515a12 12 0 1 0 16.97 16.97"/>
      </svg>
    </div>
    <p class="eyebrow">Anchor Point Developments</p>
    <h1>AnchorSense HomePro</h1>
    <p class="tagline">Smart monitoring for tanks and storage systems.</p>
    <div class="footer">
      <a href="mailto:anchorpointdevelopments@gmail.com">anchorpointdevelopments@gmail.com</a>
      <a href="/privacy.html">Privacy Policy</a>
      <span>© 2026 Anchor Point Developments Ltd.</span>
    </div>
  </div>
</body>
</html>
